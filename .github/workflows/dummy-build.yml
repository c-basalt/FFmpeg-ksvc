name: Build FFmpeg dummy

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: create dummy
      run: |
        echo aaa > ffmpeg.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg
        path: |
          ffmpeg.exe
